# ── Core ──────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# ── Keybindings ───────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split with same directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-window-option -g mode-keys vi

# ── Dracula status bar (no plugin dependencies) ───────────────────────────────
# Dracula colors
dracula_bg="#282a36"
dracula_current_line="#44475a"
dracula_fg="#f8f8f2"
dracula_comment="#6272a4"
dracula_purple="#bd93f9"
dracula_green="#50fa7b"
dracula_orange="#ffb86c"
dracula_pink="#ff79c6"

set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-style "bg=${dracula_bg} fg=${dracula_fg}"

set -g status-left-length 40
set -g status-left "#[bg=${dracula_purple},fg=${dracula_bg},bold] #S #[bg=${dracula_bg},fg=${dracula_purple}]"

set -g status-right-length 80
set -g status-right "#[fg=${dracula_comment}]#[bg=${dracula_comment},fg=${dracula_bg}] #h #[bg=${dracula_bg},fg=${dracula_current_line}]#[bg=${dracula_current_line},fg=${dracula_fg}] %Y-%m-%d %H:%M "

set -g window-status-format "#[fg=${dracula_comment}] #I #W "
set -g window-status-current-format "#[bg=${dracula_current_line},fg=${dracula_pink},bold] #I #W #[bg=${dracula_bg},fg=${dracula_current_line}]"

set -g pane-border-style "fg=${dracula_current_line}"
set -g pane-active-border-style "fg=${dracula_purple}"
set -g message-style "bg=${dracula_current_line},fg=${dracula_fg}"
