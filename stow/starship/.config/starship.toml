[username]
format = "[$user]($style) "

[hostname]
ssh_only = false
ssh_symbol = " "
format = "[$ssh_symbol](white)[$hostname]($style) "

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
format            = "[$read_only]($read_only_style)[$path]($style) "
#style             = "bold green"
truncation_length = 3
truncate_to_repo  = true
truncation_symbol = "…/"
read_only         = " 󰌾"
read_only_style   = "red"
home_symbol = ""

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""
"Projects" = "󱌢"
"School" = "󰑴"
"code" = ""
".config" = ""

