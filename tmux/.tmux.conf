# ── Core ──────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# ── Keybindings ───────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split with same directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-window-option -g mode-keys vi

# ── Status bar (uses terminal ANSI colors — palette set in terminal emulator) ──
# colour0-7 = normal, colour8-15 = bright
# 5=magenta  2=green  8=bright_black(comment)  0=black  7=white

set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-style "bg=colour0 fg=colour7"

set -g status-left-length 40
set -g status-left "#[bg=colour5,fg=colour0,bold] #S #[bg=colour0,fg=colour5]"

set -g status-right-length 80
set -g status-right "#[fg=colour8]#[bg=colour8,fg=colour0] #h #[bg=colour0,fg=colour8] %Y-%m-%d %H:%M "

set -g window-status-format "#[fg=colour8] #I #W "
set -g window-status-current-format "#[fg=colour13,bold] #I #W "

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour5"
set -g message-style "bg=colour8,fg=colour7"
